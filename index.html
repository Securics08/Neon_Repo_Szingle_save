<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8"> <title>Neon Jegyzet - Memória Reset - 500MB</title> <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script> <style>
  body{ margin:0; background:#0a0a0a; color:#fff; font-family:Arial, sans-serif; } .container{ display:flex; height:100vh; } .main{ flex:1; padding:20px; display:flex; flex-direction:column; } .editor{ flex:1; background:#050505; border:1px solid #333; border-radius:6px; padding:10px; font-size:18px; color:white; overflow-y:auto; } /* Memória kijelző */
  .storage-container { margin-bottom: 20px; padding: 10px; border: 1px solid #444; border-radius: 8px; } .storage-bar-bg { width: 100%; height: 20px; background: #222; border-radius: 10px; overflow: hidden; border: 1px solid #555; } #storageBarFill { height: 100%; width: 0%; transition: width 0.5s ease; } #storageText { font-size: 18px; font-weight: bold; margin-bottom: 8px; } .btn-reset { background: #ff0000; color: white; padding: 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; } .btn-reset:hover { background: #cc0000; } .toolbar { margin-bottom: 10px; display: flex; gap: 10px; } button { padding: 8px 15px; cursor: pointer; background: #111; color: white; border: 1px solid #444; border-radius: 4px; } </style>
</head>
<body>
<div class="container">
  <div class="main">
    <div class="storage-container">
      <div id="storageText">Memória ellenőrzése...</div> <div class="storage-bar-bg"><div id="storageBarFill"></div></div> <button class="btn-reset" onclick="hardReset()">MINDEN ADAT TÖRLÉSE ÉS ZÖLDRE VÁLTÁS</button> </div>
    <div class="toolbar">
      <button onclick="importNotes()">Import (JSON)</button> <button onclick="newNote()">Tiszta lap</button> </div>
    <div id="editor" class="editor" contenteditable="true"></div> </div>
</div>
<script>
  const storageBarFill = document.getElementById("storageBarFill"); const storageText = document.getElementById("storageText"); const editor = document.getElementById("editor"); 
  const MAX_MB = 500;
  const MAX_BYTES = MAX_MB * 1024 * 1024;
  function updateStorageStatus() {
    let used = 0; try {
        for (let x in localStorage) { if (localStorage.hasOwnProperty(x)) used += (localStorage[x].length * 2); } 
        const usedPerc = ((used / MAX_BYTES) * 100).toFixed(2); 
        const usedMB = (used / (1024*1024)).toFixed(2);
        const freeMB = ((MAX_BYTES - used) / (1024 * 1024)).toFixed(2); 
        let color = "#00ff00"; if(usedPerc > 70) color = "#ffff00"; if(usedPerc > 95) color = "#ff0000"; 
        storageBarFill.style.width = Math.min(usedPerc,100) + "%"; 
        storageBarFill.style.background = color; 
        storageText.innerHTML = `Memória állapot: <span style="color:${color}">${usedPerc}% - Használt: ${usedMB} MB / ${MAX_MB} MB (Szabad: ${freeMB} MB)</span>`; 
    } catch(e) {
        storageText.innerHTML = "<span style='color:red'>Hiba a memória beolvasásakor!</span>"; }
  }
  function hardReset() {
    if(confirm("Ez véglegesen törli a böngészőben ragadt összes adatot, hogy újra zöld legyen a csík. A gépeden lévő fájlok megmaradnak. Mehet?")) {
        localStorage.clear(); updateStorageStatus(); editor.innerHTML = ""; alert("A memória sikeresen kiürítve, újra zöld a rendszer! 500MB szabad!"); }
  }
  function importNotes() {
    const input = document.createElement("input"); input.type="file"; input.accept=".json"; input.onchange = e => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const imported = JSON.parse(ev.target.result); editor.innerHTML = imported.content || "Nincs tartalom a fájlban."; alert("Sikeresen betöltve a fájlból!"); updateStorageStatus(); } catch(err) {
          alert("Hiba: Ez a fájl nem jegyzet fájl vagy sérült."); }
      };
      reader.readAsText(file); };
    input.click();
  }
  function newNote() { editor.innerHTML = ""; } 
  window.onload = updateStorageStatus; 
  setInterval(updateStorageStatus, 2000);
</script>
</body>
</html>
