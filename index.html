function loadAll(){

    const el = document.getElementById('f'+i);

  }

function getRandomNeonColor(){
  const colors = ['#00f6ff','#ff00ff','#ffff00','#ff6600','#ff0066','#5865f2','#ff3300','#00ccff','#ffcc00','#cc00ff','#00ffcc','#ff99cc','#0099ff','#ff9900','#ff00aa','#ff3399','#00ccff','#ff3366']; // NINCS ZÖLD - csak a megnyitott lesz zöld
  return colors[Math.floor(Math.random()*colors.length)];
}
function applyRandomColors(){
  const tabs = document.querySelectorAll('.topbar > button');
  tabs.forEach((b,i)=>{
    if(i>=1 && i<=6){
      if(b.classList.contains('active')){
        b.style.background='#00ff00';
        b.style.borderColor='#00ff00';
        b.style.color='#000';
        b.style.boxShadow='0 0 18px #00ff00, 0 0 30px #00ff00';
      } else {
        const col = getRandomNeonColor();
        b.style.background=col;
        b.style.borderColor=col;
        b.style.color=(col==='#ffff00'||col==='#00ff99'||col==='#ffcc00'||col==='#99ff00'||col==='#00f6ff'||col==='#00ffcc'||col==='#00ff00')?'#000':'#fff';
        b.style.boxShadow='0 0 10px '+col;
      }
    }
  });
}
function showTab(n){
  const tabs = document.querySelectorAll('.topbar > button');
  tabs.forEach((b,i)=>{ if(i>=1 && i<=6) b.classList.toggle('active', (i-1)===n); });
  document.querySelectorAll('iframe').forEach((f,i)=>f.classList.toggle('active',i===n));
  setTimeout(applyRandomColors, 30);
}

loadAll();
setTimeout(()=>{ applyRandomColors(); }, 1000);
setInterval(()=>{ applyRandomColors(); }, 8000); // 8mp-enként új random

let pendingExports = {};
let exportResolver = null;

window.addEventListener('message', (e)=>{
  if(!e.data) return;
  if(e.data.type==='EXPORT_4IN1_DATA'){
    pendingExports[e.data.source] = e.data.data;
    console.log('EXPORT kapott:', e.data.source);
    if(Object.keys(pendingExports).length>=6 && exportResolver){
      exportResolver(pendingExports);
    }
  }
});

function showStatus(msg, color='#00ff00', duration=3000){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.borderColor = color;
  el.style.color = color;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), duration);
}

function openExportModal(){
  const now = new Date();
  const def = `6in1-V18_${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}`;
  document.getElementById('exportNameInput').value = def;
  document.getElementById('exportModal').classList.add('show');
  setTimeout(()=>document.getElementById('exportNameInput').select(), 100);
  console.log('EXPORT MODAL NYITVA');
}
function closeExportModal(){ document.getElementById('exportModal').classList.remove('show'); }
function openResetModal(){ document.getElementById('resetModal').classList.add('show'); }
function closeResetModal(){ document.getElementById('resetModal').classList.remove('show'); }

async function doExport(){
  const nameInput = document.getElementById('exportNameInput').value.trim();
  if(!nameInput){ alert('Adj meg nevet!'); return; }
  closeExportModal();
  showStatus('⏳ Gyűjtöm a 6 almenü adatait...', '#ffff00', 8000);

  pendingExports = {};
  const iframes = [document.getElementById('f0'), document.getElementById('f1'), document.getElementById('f2'), document.getElementById('f3'), document.getElementById('f4'), document.getElementById('f5')];
  const exportPromise = new Promise((resolve)=>{
    exportResolver = resolve;
    setTimeout(()=>{
      console.log('EXPORT timeout, ennyi jött:', Object.keys(pendingExports));
      resolve(pendingExports);
    }, 5000);
  });

  iframes.forEach(f=>{
    try{ f.contentWindow.postMessage({type:'EXPORT_4IN1_REQUEST'}, '*'); console.log('EXPORT kérés küldve', f.id); }catch(e){ console.log('EXPORT küldés hiba', e); }
  });

  const results = await exportPromise;
  exportResolver = null;

  console.log('EXPORT végeredmény:', Object.keys(results));

  let parentLocal = {};
  try{ 
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && !k.startsWith('4in1_backup_')){
        const v = localStorage.getItem(k);
        if(v && v.length < 100000) parentLocal[k]=v;
      }
    }
  }catch(e){}

  const fullExport = {
    version: "6in1-V18-RANDOM-AKTIV-ZOLD",
    exportDate: new Date().toISOString(),
    exportName: nameInput,
    modules: {
      "1_neon_repo": results['1_neon_repo'] || [],
      "2_alsokep": results['2_alsokep'] || {notes:{}, current:''},
      "3_vegtelen": results['3_vegtelen'] || {},
      "4_ultra": results['4_ultra'] || [],
      "5_neon_vault": results['5_neon_vault'] || {id:"root", name:"Gyökér", type:"folder", children:[]},
      "6_discord": results['6_discord'] || {}
    },
    parentLocalStorage: parentLocal
  };

  const blob = new Blob([JSON.stringify(fullExport, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nameInput.endsWith('.json') ? nameInput : nameInput + '.json';
  a.click();
  URL.revokeObjectURL(a.href);

  showStatus('✅ EXPORT kész: ' + a.download + ' (' + Object.keys(results).length + '/6)', '#00ff00', 5000);
}

function doResetAllData(){
  closeResetModal();
  if(!confirm('UTOLSÓ MEGERŐSÍTÉS: Törlöd az ÖSSZES ADATOT?')) return;
  const iframes = [document.getElementById('f0'), document.getElementById('f1'), document.getElementById('f2'), document.getElementById('f3'), document.getElementById('f4'), document.getElementById('f5')];
  iframes.forEach(f=>{ try{ f.contentWindow.postMessage({type:'RESET_4IN1_ALL'}, '*'); }catch(e){} });
  try{
    const keysToRemove = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && (k.includes('Securics') || k.includes('Neon') || k.includes('Note') || k.includes('notes') || k.includes('ULTRA') || k.includes('Alsokep') || k.includes('4in1') || k.includes('Vault') || k.includes('Discord'))){
        keysToRemove.push(k);
      }
    }
    keysToRemove.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  }catch(e){}
  showStatus('💥 RESET kész!', '#ff0000', 4000);
  setTimeout(()=>{
    const fresh = b64htmls.map(b64ToUtf8);
    document.querySelectorAll('iframe').forEach((f,i)=>{ try{ f.srcdoc = fresh[i]; }catch(e){} });
    showTab(0);
  }, 800);
}

function triggerImport(){
  document.getElementById('importFileInput').click();
}

document.getElementById('importFileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data.modules){ alert('Hibás file!'); return; }
    if(!confirm(`Importálod?\n\nNév: ${data.exportName||'?'}\n- Repo: ${(data.modules['1_neon_repo']||[]).length}\n- Alsókép: ${Object.keys(data.modules['2_alsokep']?.notes||{}).length}\n- Végtelen: ${Object.keys(data.modules['3_vegtelen']||{}).length}\n- ULTRA: ${(data.modules['4_ultra']||[]).length}\n- Vault: ${(data.modules['5_neon_vault']?.children?.length||0)}\n- Discord: ${Object.keys(data.modules['6_discord']||{}).length}`)) return;
    showStatus('⏳ Importálás...', '#0088ff', 8000);
    const mapping = [
      {frame: document.getElementById('f0'), source:'1_neon_repo', data: data.modules['1_neon_repo']},
      {frame: document.getElementById('f1'), source:'2_alsokep', data: data.modules['2_alsokep']},
      {frame: document.getElementById('f2'), source:'3_vegtelen', data: data.modules['3_vegtelen']},
      {frame: document.getElementById('f3'), source:'4_ultra', data: data.modules['4_ultra']},
