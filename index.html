function b64DecodeUnicode(str) {
  return decodeURIComponent(atob(str).split('').map(function(c) {
    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
  }).join(''));
}
function show(n){
  document.querySelectorAll('iframe').forEach(function(f){f.classList.remove('show');});
  document.querySelectorAll('#top button').forEach(function(b){b.classList.remove('active');});
  var target = document.getElementById('f'+n);
  var key = 'f'+n+'.html';
  if(target && !target.srcdoc){
    try{ target.srcdoc = b64DecodeUnicode(pages[key]); }catch(e){ console.error(e); }
  }
  if(target) target.classList.add('show');
  var btn = document.getElementById('btn-'+n);
  if(btn) btn.classList.add('active');
  try{ localStorage.setItem('10in1_last_tab', n); }catch(e){}
}
show(0);
try{
  var last = localStorage.getItem('10in1_last_tab');
  if(last!==null && parseInt(last)!==0){ show(parseInt(last)); }
}catch(e){}
</script>
