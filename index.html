function showView(v){
  document.querySelectorAll('.view').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
  if(v==='up'){document.getElementById('up').classList.add('on');document.getElementById('b1').classList.add('active');}
  else{document.getElementById('gal').classList.add('on');document.getElementById('b2').classList.add('active');}
  localStorage.setItem('view',v);
}
let sv=localStorage.getItem('view');if(sv==='gal')showView('gal');
